<!doctype html>
<html lang="en-AU">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#336B87">
	<link rel="manifest" href="manifest.json">
	<link rel="apple-touch-icon" href="icon-192.png">
	<link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32" />
	<link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16" />
	<!-- Icon is CC-BY VisualPharm https://findicons.com/icon/558618/zip -->
	
	<title>Remove hidden files from zip</title>
	<!--
/*
#90AFC5 mist
#336B87 stone
#763626

#F4CC70
#DE7A22
#20948B
#6AB187

#e5edf1 body
#0f3c4b text

#c8dadf container
#92b0b3 outline

*/

-->
	<style>
		:root {
			--bg: #90afc5;
			--obg: #336B87;
			--tc: #000;
			--otc: #fff;
			--otch: var(--bg);
			/* 00ffff #c8dadf .15s*/
		}
		
		/*a lot of these styles come from view-source:https://css-tricks.com/examples/DragAndDropFileUploading/*/
		body {
			font-family: sans-serif;
			color: var(--tc);
			padding: 5rem 1.25rem;
			background-color: var(--bg);
		}
		
		.container {
			/* background-color: #92b0b3; */
			outline: 2px dashed #fff;
			outline-offset: -10px;
			transition: outline-offset .15s ease-in-out, background-color .15s linear, color .15s ease-in-out;
			background-color: var(--obg);
			padding: 100px 20px;
			box-sizing: border-box;
			vertical-align: baseline;
			border: 0;
			color: var(--otc);
		}
		#containerContainer {
			width: 100%;
			max-width: 680px;
			text-align: center;
			margin: 0 auto;
			font-size: 1.5rem;
		}
		
		.animated {
			outline-offset: -20px;
			outline-color: var(--obg);
			background-color: var(--otc);
			color: var(--obg);
		}
		
		.container label {
			cursor: pointer;
		}
		
		.container label:hover strong {
			color: var(--otch);
		}
		
		p, a { 
			/*text-decoration: none;*/
			font-style: italic;
			color: var(--tc);
			font-size: 0.75rem;
		}
		.rembox > label {
			display: inline-flex;
		}
		
		.list {
			text-align: initial;
			margin-top: 1rem;
		}
		.list li {
			font-size: 0.9rem;
		}
		
		.flex {
			display: flex;
		}
		.stretch {
			align-items: stretch;
		}
		.flex section {
			flex-grow: 1;
		}
		
		/*.flexcontainer label {
			text-align: center;
		}*/
		
		.hidden {
			display: none;
		}
		.center {
			text-align: center;
			justify-content: center;
		}
		
		.rembox {
			margin-top: .5em;
		}
		.default {
			cursor: default;
		}
		.reminput {
			min-width: 1em;
			background-color: var(--obg);
			cursor: text;
			color: var(--otc);
			/*make the text box look like the plain editable text it replaced*/
			border: 0;
			margin: 0;
			padding: 0;
			font: inherit;
			box-sizing: content-box;
		}

		/*hidden from view but still reachable with the keyboard and screen readers*/
		.visually-hidden {
			position: absolute;
			width: 1px;
			height: 1px;
			margin: -1px;
			overflow: hidden;
			clip: rect(0 0 0 0);
			white-space: nowrap;
		}
		.container input:focus-visible + label {
			outline: 2px solid var(--otch);
			outline-offset: 4px;
		}
		.container input:focus-visible + label strong {
			color: var(--otch);
		}

		/*only shown by alt.js in browsers that can pick folders*/
		.folder {
			display: block;
			margin-top: .75em;
			font-size: 1rem;
		}
		.folder[hidden] {
			display: none;
		}
		
		.status {
			margin-top: .75em;
			font-size: 1rem;
		}
		.status:empty {
			display: none;
		}
		.status a {
			color: inherit;
			font-size: inherit;
		}

		.list li {
			overflow-wrap: anywhere;
		}
		.list li.removed {
			text-decoration: line-through;
			opacity: .6;
		}
		.list li.more {
			font-style: italic;
		}

		@media (max-width: 600px) {
			body {
				padding: 2.5rem 1rem;
			}
			#lists {
				flex-direction: column;
			}
		}

	</style>
</head>
<body>
	<h2 class="center">Remove Hidden Files from Zip Folders</h2>
	<section id="containerContainer">
		<section class="container">
			<input type="file" id="fileElem" class="visually-hidden" accept=".zip,application/zip">
			<label id="label" for="fileElem"><strong>Select zip</strong> which has hidden files to remove</label>
			<input type="file" id="folderElem" class="visually-hidden" webkitdirectory>
			<label class="folder" for="folderElem" hidden>or <strong>choose a folder</strong> to zip without them</label>
			<div id="status" class="status" aria-live="polite"></div>
		</section>
	</section>
	<section class="center">
		<section class="flex center rembox default">

			<input type="checkbox" id="remc">
			<label for="remc">Remove&nbsp;</label><input type="text" id="rem" class="reminput" value="-raw" aria-label="Text to remove from the end of the zip filename" spellcheck="false" autocomplete="off"><label for="remc">&nbsp;from zip filename</label>
		</section>
		<div>
			<p>A zip file will be downloaded with the hidden files removed. Works offline, and your files never leave your device.</p>
		</div>
	</section>
	<section id="lists" class="flex stretch hidden">
		<section class="list left">
			<label>Original</label>
			<p id="itemsleft"></p>
			<ul id="left">
			</ul>
		</section>
		<section class="list right">
			<label>Result</label>
			<p id="itemsright"></p>
			<ul id="right">
			</ul>
		</section>
	</section>
	<p class="center default">Thanks heaps to <a href="https://css-tricks.com/drag-and-drop-file-uploading/">CSS-Tricks</a> for the layout.</p>

	<script src="alt.js" defer></script>
</body>
</html>
